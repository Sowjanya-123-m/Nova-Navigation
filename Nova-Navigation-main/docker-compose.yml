version: '3.9'
services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql+pymysql://root:password@db:3306/antigravity
      SECRET_KEY: change-me
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: antigravity
    ports:
      - "3306:3306"
