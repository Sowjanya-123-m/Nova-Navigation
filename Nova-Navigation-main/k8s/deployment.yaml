apiVersion: apps/v1
kind: Deployment
metadata:
  name: antigravity-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: antigravity
  template:
    metadata:
      labels:
        app: antigravity
    spec:
      containers:
        - name: antigravity
          image: antigravity:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: antigravity-config
            - secretRef:
                name: antigravity-secret
